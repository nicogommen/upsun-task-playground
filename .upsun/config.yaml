applications:
  frontend:
    source:
      root: /frontend
    type: "python:3.14"

    # uv is installed by Upsun (see https://developer.upsun.com/docs/languages/python/dependencies#uv).
    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen --no-dev

    web:
      commands:
        start: ".venv/bin/gunicorn -w 2 -b localhost:$PORT app:app"
      locations:
        "/":
          passthru: true

  admin:
    source:
      root: /admin
    type: "python:3.14"

    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen --no-dev

    # Scopes the bearer tokens the auth proxy at localhost:8200 will mint for
    # this app: task/operate to trigger and manage coding-agent runs, env/view
    # to read the activity and its log while polling a run (admin/upsun_client.py).
    # env/view covers this app's OWN environment only; the preview-env read it
    # was also meant to serve is a cross-env call that 403s (ITERATION-2 Q-iter2-8).
    # Per ITERATION-2 §3.4 / §4.6 and the authorizations doc.
    authorizations:
      - type: task
        resource: coding-agent
        action: operate
      - type: env
        action: view

    # Persistent run history (ITERATION-2.x). Short form: the relationship name
    # resolves to the service of the same name on its default endpoint. Upsun
    # injects POSTGRESQL_HOST/_PORT/_USERNAME/_PASSWORD/_PATH, which is what
    # admin/storage.py reads. Only admin talks to the database.
    relationships:
      postgresql:

    variables:
      env:
        SESSION_LIFETIME_DAYS: "7"

    # Single-worker per D10 (uvicorn defaults to one worker; in-memory state
    # in v1 needs that constraint until the iter 2.x Postgres swap).
    web:
      commands:
        start: ".venv/bin/uvicorn app:app --host 0.0.0.0 --port $PORT"
      locations:
        "/":
          passthru: true

tasks:
  coding-agent:
    source:
      root: /coding-agent
    type: "python:3.14"

    # Workaround: the task config validator rejects both `dependencies` and
    # `stack` (Unknown key), so the platform-native uv installs (the app's
    # `dependencies.python3.uv` and the composable image's `stack.packages`)
    # are both unavailable on tasks. Using Astral's official installer keeps
    # the path pip-free until the schema gap is closed (see SPEC §7 Q5).
    hooks:
      build: |
        set -eux
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --frozen

    run:
      command: ".venv/bin/python run.py"
      timeout: 900

    # PCO-695: declaring authorizations lets the local auth proxy (localhost:8200)
    # mint an env/view-scoped token from inside the task. Confirmed reachable.
    # Nothing in the iteration 2 flow consumes it yet; it is groundwork for the
    # iteration 3 verification step (SPEC §4.4, FUTURE-ITERATIONS iteration 3).
    authorizations:
      - type: env
        action: view

    mounts:
      "/tmp":
        source: "tmp"

services:
  # 18 is the newest version Upsun supports (meta.upsun.com/images). Greenfield
  # database with nothing to migrate, so there is no reason to start behind.
  # Disk is allocated per environment: upsun resources:set --service postgresql.
  # Note every environment gets its own instance, preview envs included
  # (ITERATION-2.x §7).
  postgresql:
    type: "postgresql:18"

routes:
  "https://{default}/":
    type: upstream
    upstream: "frontend:http"
  "https://admin.{default}/":
    type: upstream
    upstream: "admin:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
