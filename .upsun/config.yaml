applications:
  flask:
    source:
      root: /
    type: "python:3.14"

    # uv is installed by Upsun (see https://developer.upsun.com/docs/languages/python/dependencies#uv).
    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen --no-dev

    web:
      commands:
        start: ".venv/bin/gunicorn -w 2 -b localhost:$PORT app:app"
      locations:
        "/":
          passthru: true

tasks:
  agent:
    source:
      root: /agent
    type: "python:3.14"

    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen

    run:
      command: ".venv/bin/python run.py"
      timeout: 900

    mounts:
      "/tmp":
        source: "tmp"

routes:
  "https://{default}/":
    type: upstream
    upstream: "flask:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
