applications:
  flask:
    source:
      root: /
    type: "python:3.14"

    # uv is installed by Upsun (see https://developer.upsun.com/docs/languages/python/dependencies#uv).
    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen --no-dev

    web:
      commands:
        start: ".venv/bin/gunicorn -w 2 -b localhost:$PORT app:app"
      locations:
        "/":
          passthru: true

tasks:
  agent:
    source:
      root: /agent

    # Composable image (Nix-based) lets us declare python and uv as first-class
    # stack entries. uv is on $PATH automatically.
    # See https://developer.upsun.com/docs/configure-apps/app-reference/composable-image
    # 25.11 is the current latest channel (per meta.upsun.com/composable).
    # python@3.13 is the latest Python in that channel; the flask app stays on
    # python:3.14 (single-runtime image) where 3.14 is supported.
    type: "composable:25.11"
    stack:
      runtimes:
        - "python@3.13"
      packages:
        - uv

    hooks:
      build: |
        set -eux
        uv sync --frozen

    run:
      command: ".venv/bin/python run.py"
      timeout: 900

    mounts:
      "/tmp":
        source: "tmp"

routes:
  "https://{default}/":
    type: upstream
    upstream: "flask:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
