applications:
  frontend:
    source:
      root: /frontend
    type: "python:3.14"

    # uv is installed by Upsun (see https://developer.upsun.com/docs/languages/python/dependencies#uv).
    dependencies:
      python3:
        uv: "*"

    hooks:
      build: |
        set -eux
        uv sync --frozen --no-dev

    web:
      commands:
        start: ".venv/bin/gunicorn -w 2 -b localhost:$PORT app:app"
      locations:
        "/":
          passthru: true

tasks:
  coding-agent:
    source:
      root: /coding-agent
    type: "python:3.14"

    # Workaround: the task config validator rejects both `dependencies` and
    # `stack` (Unknown key), so the platform-native uv installs (the app's
    # `dependencies.python3.uv` and the composable image's `stack.packages`)
    # are both unavailable on tasks. Using Astral's official installer keeps
    # the path pip-free until the schema gap is closed (see SPEC §7 Q5).
    hooks:
      build: |
        set -eux
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv sync --frozen

    run:
      command: ".venv/bin/python run.py"
      timeout: 900

    mounts:
      "/tmp":
        source: "tmp"

routes:
  "https://{default}/":
    type: upstream
    upstream: "frontend:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
