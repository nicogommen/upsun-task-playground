<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Upsun Task Playground</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">
  {% set user = request.session.get('user') %}
  {% if user %}
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <p class="font-semibold">Upsun Task Playground <span class="text-slate-400 font-normal">— Admin</span></p>
      <form action="/logout" method="post" class="m-0">
        <button type="submit" class="text-sm text-slate-600 hover:text-slate-900 transition-colors">
          Sign out <span class="font-mono text-xs text-slate-400">({{ user }})</span>
        </button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
