{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="flex-1 flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
      <p class="font-mono text-xs uppercase tracking-[0.2em] text-indigo-600 mb-3">Upsun Admin</p>
      <h1 class="text-2xl font-semibold mb-2">Sign in</h1>
      <p class="text-sm text-slate-600 mb-6">Admin access only.</p>
      {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{ error }}</div>
      {% endif %}
      <form action="/login" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Username</label>
          <input type="text" name="username" required autofocus
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
          class="w-full px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
