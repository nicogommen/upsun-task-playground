[project]
name = "upsun-task-playground"
version = "0.1.0"
description = "Flask app deployed on Upsun for testing the new task container."
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "yamllint>=1.38",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "coding-agent/.venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
