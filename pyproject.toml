[project]
name = "upsun-task-playground-tooling"
version = "0.1.0"
description = "Shared dev tooling for the upsun-task-playground repo (ruff, yamllint). Runtime deps live in each app's own pyproject.toml."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15",
    "yamllint>=1.38",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "frontend/.venv", "admin/.venv", "coding-agent/.venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
